# Project-scoped Codex MCP configuration.
#
# Export the bare TikHub token as TIKHUB_API_KEY before starting Codex.
# This file intentionally contains no credentials and is loaded only when this
# repository is trusted by Codex.

[mcp_servers.tikhub-tiktok]
url = "https://mcp.tikhub.io/tiktok/mcp"
bearer_token_env_var = "TIKHUB_API_KEY"
default_tools_approval_mode = "prompt"
startup_timeout_sec = 20
tool_timeout_sec = 120
required = false

