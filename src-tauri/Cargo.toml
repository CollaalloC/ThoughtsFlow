[package]
name = "thoughsflow"
version = "0.1.0"
description = "Local-first AI reasoning and decision workspace"
authors = ["ThoughsFlow contributors"]
edition = "2024"
rust-version = "1.85"

[lib]
name = "thoughsflow_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[features]
webview-e2e = ["dep:tauri-plugin-wdio-webdriver"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate", "uuid", "chrono", "json"] }
tauri = { version = "2", features = [] }
tauri-plugin-wdio-webdriver = { version = "1", optional = true }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
proptest = "1"
tempfile = "3"
tauri = { version = "2", features = ["test"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
